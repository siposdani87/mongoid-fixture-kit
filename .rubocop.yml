plugins:
  - rubocop-rake
AllCops:
  TargetRubyVersion: 3.2
  EnabledByDefault: true

# Customize rules
Metrics/AbcSize:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/BlockLength:
  Enabled: false
Style/StaticClass:
  Enabled: false
Style/Documentation:
  Enabled: false
Style/Copyright:
  Enabled: false
Style/DocumentationMethod:
  Enabled: false
Style/MissingElse:
  Enabled: false
Style/ConstantVisibility:
  Enabled: false
Style/EmptyElse:
  Enabled: false
Style/FrozenStringLiteralComment:
  Enabled: false
Layout/LineLength:
  Enabled: false
Lint/ConstantResolution:
  Enabled: false
Lint/ShadowingOuterLocalVariable:
  Enabled: true
Bundler/GemComment:
  Enabled: false
Style/StringHashKeys:
  Exclude:
    - 'test/**/*'
Style/MapIntoArray:
  Exclude:
    - 'test/**/*'
Style/HashEachMethods:
  Exclude:
    - 'test/**/*'
